<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه پیدا نشد | سلام صدر بویز</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon-192.png">
  <style>
    body{font-family:'Vazirmatn',system-ui,sans-serif;background:#0D0B08;color:#FAF6ED;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;margin:0;text-align:center;padding:20px}
    b{font-size:52px;background:linear-gradient(90deg,#F2A90A,#22C4D6,#12A06B,#E0343C);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:rgba(250,246,237,.7);font-size:16px}
    a{background:#F2A90A;color:#241A05;padding:12px 30px;border-radius:99px;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <b>۴۰۴</b>
  <p>این صفحه توی دفتر صدر بویز پیدا نشد!</p>
  <a id="home" href="./">برگرد به خانه</a>
  <script>
    (function () {
      var seg = location.pathname.split('/').filter(Boolean);
      if (seg.length > 1) document.getElementById('home').href = '/' + seg[0] + '/';
    })();
  </script>
</body>
</html>
