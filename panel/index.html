<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com; font-src 'self'; base-uri 'self'; form-action 'self'">
  <title>پنل مدیریت | سلام صدر بویز</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preload" href="../assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- ── Auth screen ── -->
  <div id="auth-screen">
    <div class="auth-card">
      <img src="../assets/img/logo.svg" alt="نشان صدر بویز" width="72" height="72" class="auth-logo">
      <h1>پنل مدیریت</h1>
      <p class="auth-sub">سلام صدر بویز</p>
      <form id="auth-form" autocomplete="off">
        <input type="password" id="auth-pass" placeholder="رمز مدیر…" maxlength="64" required aria-label="رمز مدیر">
        <button class="pbtn pbtn-primary" type="submit" id="auth-submit">ورود</button>
      </form>
      <div id="auth-msg" class="pmsg err" hidden role="alert"></div>
    </div>
  </div>

  <!-- ── Panel app ── -->
  <div id="panel-app" hidden>
    <header id="p-top">
      <div class="pt-right">
        <img src="../assets/img/logo.svg" alt="" width="38" height="38">
        <div>
          <b>پنل مدیریت صدر بویز</b>
          <span id="draft-state">…</span>
        </div>
      </div>
      <div class="pt-left">
        <button class="pbtn pbtn-ghost pbtn-small" id="btn-preview" type="button">پیش‌نمایش سایت</button>
        <button class="pbtn pbtn-primary pbtn-small" id="btn-publish" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          انتشار در سایت
        </button>
        <button class="pbtn pbtn-ghost pbtn-small" id="btn-logout" type="button">خروج</button>
      </div>
    </header>

    <div id="p-body">
      <aside id="p-side">
        <nav aria-label="بخش‌های پنل">
          <button type="button" class="pnav is-active" data-view="dash">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
            داشبورد
          </button>
          <button type="button" class="pnav" data-view="homework">
            <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h5v15H6a2 2 0 0 0-2 2Zm16 0V6a2 2 0 0 0-2-2h-5v15h5a2 2 0 0 1 2 2Z"/></svg>
            تکالیف
          </button>
          <button type="button" class="pnav" data-view="announcements">
            <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2V4Z"/><path d="M9 9h6M9 13h6"/></svg>
            اعلان‌ها
          </button>
          <button type="button" class="pnav" data-view="subjects">
            <svg viewBox="0 0 24 24"><path d="M12 5c-1.5-1.3-4-1.8-7-1.3v14c3-.5 5.5 0 7 1.3 1.5-1.3 4-1.8 7-1.3v-14c-3-.5-5.5 0-7 1.3Zm0 0v14"/></svg>
            درس‌ها
          </button>
          <button type="button" class="pnav" data-view="schedule">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            برنامه‌ی کلاسی
          </button>
          <button type="button" class="pnav" data-view="content">
            <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9Z"/></svg>
            محتوای سایت
          </button>
          <button type="button" class="pnav" data-view="vip">
            <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            بخش ویژه
          </button>
          <button type="button" class="pnav" data-view="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.8 5.8l1.8 1.8M16.4 16.4l1.8 1.8M18.2 5.8l-1.8 1.8M7.6 16.4l-1.8 1.8"/></svg>
            تنظیمات و انتشار
          </button>
        </nav>
        <div class="ps-foot">
          <span class="ps-latin">SALAM SADR BOYS · PANEL</span>
        </div>
      </aside>

      <main id="p-main" aria-live="polite">
        <section id="view-dash" class="pview is-active"></section>
        <section id="view-homework" class="pview"></section>
        <section id="view-announcements" class="pview"></section>
        <section id="view-subjects" class="pview"></section>
        <section id="view-schedule" class="pview"></section>
        <section id="view-content" class="pview"></section>
        <section id="view-vip" class="pview"></section>
        <section id="view-settings" class="pview"></section>
      </main>
    </div>
  </div>

  <div id="p-toast" role="status" aria-live="polite" hidden></div>

  <script src="./app-core.js" defer></script>
  <script src="./app-ui.js" defer></script>
</body>
</html>
